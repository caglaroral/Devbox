<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Devbox</title>
<link rel="stylesheet" href="/static/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%23d29922%27/%3E%3Ctext x=%2716%27 y=%2722%27 font-family=%27monospace%27 font-size=%2714%27 font-weight=%27700%27 text-anchor=%27middle%27 fill=%27%230d1117%27%3E%3E_%3C/text%3E%3C/svg%3E">
<style>
body { display: flex; align-items: center; justify-content: center; min-height: 100dvh; overflow: auto;
  background: radial-gradient(1200px 600px at 50% -10%, var(--bg-subtle), var(--bg)); }
.modal { width: min(400px, calc(100vw - 24px)); border: 1px solid var(--border); border-radius: 12px; background: var(--bg-subtle);
  box-shadow: var(--shadow); overflow: hidden; }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--border); font-weight: 600; }
.modal-head .host { margin-left: auto; color: var(--fg-muted); font: 12px var(--mono); }
form { padding: 16px; display: flex; flex-direction: column; gap: 4px; }
.field input, .field select { width: 100%; }
.err { color: var(--danger); font-size: 13px; min-height: 1.4em; }
.note { color: var(--fg-muted); font-size: 12px; margin: 0 0 8px; }
.btn.primary { padding: 8px; font-size: 14px; }
.btn[disabled] { opacity: .6; cursor: progress; }
</style></head>
<body>
<div class="modal" role="dialog" aria-labelledby="t">
  <div class="modal-head"><span class="logo">&gt;_</span><span id="t">Devbox — login</span><span class="host" id="host"></span></div>
  <form id="f" autocomplete="on">
    <label class="field">User name
      <input id="u" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required></label>
    <label class="field">Password
      <input id="p" name="password" type="password" autocomplete="current-password" required></label>
    <label class="field">Realm
      <select id="realm"><option value="pam">Linux PAM standard authentication</option></select></label>
    <p class="note" id="note">Log in with the machine's own Linux user. Shells and sessions run as this user.</p>
    <div class="err" id="err"></div>
    <button class="btn primary" id="go">Log in</button>
  </form>
</div>
<script>
(async () => {
  try {
    const w = await (await fetch("/api/whoami")).json();
    if (w.user) { location.replace("/"); return; }
    document.getElementById("host").textContent = w.host || "";
    if (w.auth === "ssh") {
      document.querySelector("#realm option").textContent = "Linux PAM (via SSH to the host)";
      document.getElementById("note").textContent = `Log in with a Linux user of ${w.host}. Credentials are checked by the host's sshd/PAM; the password is not stored.`;
    }
    if (w.single_user) {
      document.getElementById("u").value = w.single_user;
      document.getElementById("note").textContent += ` (The service is not running as root: only "${w.single_user}" can log in.)`;
      document.getElementById("p").focus();
    } else document.getElementById("u").focus();
  } catch {}
})();
document.getElementById("f").onsubmit = async (e) => {
  e.preventDefault();
  const btn = document.getElementById("go"), err = document.getElementById("err");
  btn.disabled = true; btn.textContent = "Verifying…"; err.textContent = "";
  try {
    const r = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: document.getElementById("u").value.trim(), password: document.getElementById("p").value }) });
    if (r.ok) { location.replace("/" + location.hash); return; }
    err.textContent = await r.text();
    document.getElementById("p").select();
  } catch { err.textContent = "Cannot reach the server"; }
  btn.disabled = false; btn.textContent = "Log in";
};
</script>
</body></html>
